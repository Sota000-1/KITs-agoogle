<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch | KITs (kits-tools.net)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/time-tools.css">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('tools_theme');
      if (savedTheme === 'light') document.documentElement.classList.add('light');
    })();
  </script>
</head>
<body>

  <header class="header">
    <button class="menu-btn" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2" fill="none">
        <line x1="2" y1="6" x2="22" y2="6"></line>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="2" y1="18" x2="22" y2="18"></line>
      </svg>
    </button>

    <nav class="main-nav">
      <a href="index.html" class="nav-link">Top</a>
      <a href="index.html" class="nav-link active">Tools</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="#" class="nav-link">News</a>
      <a href="#" class="nav-link">Link</a>
      <a href="#" class="nav-link">Contact</a>
    </nav>

    <button class="theme-btn" id="themeBtn" aria-label="Toggle Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <circle cx="12" cy="12" r="4.5"></circle>
        <line x1="12" y1="1" x2="12" y2="3.5"></line>
        <line x1="12" y1="20.5" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="6" y2="6"></line>
        <line x1="18" y1="18" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3.5" y2="12"></line>
        <line x1="20.5" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="6" y2="18"></line>
        <line x1="18" y1="6" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </header>

  <main class="container">
    <div class="tool-stage">

      <!-- 黄色メーター（60秒で1周） -->
      <div class="meter-wrap">
        <svg class="meter-svg" viewBox="0 0 200 200">
          <circle class="meter-bg-circle" cx="100" cy="100" r="88"/>
          <circle class="meter-bar color-stopwatch" id="swBar" cx="100" cy="100" r="88"/>
        </svg>
        <div class="meter-center">
          <span class="meter-status">STOPWATCH</span>
          <span class="meter-time" id="swDisplay">00:00.00</span>
        </div>
      </div>

      <!-- アクションボタン（ラップ計測対応） -->
      <div class="action-btns">
        <button class="btn-ctrl btn-primary" id="swStartBtn">Start</button>
        <button class="btn-ctrl" id="swLapBtn" disabled>Lap</button>
        <button class="btn-ctrl" id="swResetBtn">Reset</button>
      </div>

      <!-- ラップタイム履歴 -->
      <div class="lap-container" id="lapList" style="display: none;"></div>

    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/stopwatch.js"></script>
</body>
</html>
