<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer | KITs (kits-tools.net)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/time-tools.css">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('tools_theme');
      if (savedTheme === 'light') document.documentElement.classList.add('light');
    })();
  </script>
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/pastel.css">
</head>
<body class="tool-detail-page">

  <header class="header">
    <button class="menu-btn" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2" fill="none">
        <line x1="2" y1="6" x2="22" y2="6"></line>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="2" y1="18" x2="22" y2="18"></line>
      </svg>
    </button>

    <nav class="main-nav">
      <a href="index.html" class="nav-link active">ツール</a>
      <a href="about.html" class="nav-link">KITsについて</a>
      <a href="news.html" class="nav-link">お知らせ</a>
      <a href="links.html" class="nav-link">リンク集</a>
      <a href="contact.html" class="nav-link">お問い合わせ</a>
    </nav>

    <button class="theme-btn" id="themeBtn" aria-label="表示テーマを切り替える">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <circle cx="12" cy="12" r="4.5"></circle>
        <line x1="12" y1="1" x2="12" y2="3.5"></line>
        <line x1="12" y1="20.5" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="6" y2="6"></line>
        <line x1="18" y1="18" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3.5" y2="12"></line>
        <line x1="20.5" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="6" y2="18"></line>
        <line x1="18" y1="6" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </header>

  <main class="container">
    <div class="tool-stage">

      <!-- カプセル型モード切替スイッチ -->
      <div class="mode-switch">
        <button class="mode-btn active" id="btnModeWork">Focus (25m)</button>
        <button class="mode-btn" id="btnModeBreak">Break (5m)</button>
      </div>

      <!-- ✦ 好きな時間設定スロット ✦ -->
      <div class="custom-time-setter" id="pomoSetter">
        <div class="time-input-slot">
          <input type="number" id="pomoInputMin" class="time-num-input" min="1" max="999" value="25">
          <span class="time-unit-label">分</span>
        </div>
        <div style="display: flex; gap: 4px; margin-left: 8px;">
          <button class="btn-quick-adjust" data-add="1">+1m</button>
          <button class="btn-quick-adjust" data-add="5">+5m</button>
          <button class="btn-quick-adjust" data-add="10">+10m</button>
          <button class="btn-quick-adjust" id="btnPresetDefault" title="標準の25m/5mに戻す">標準 (25/5)</button>
        </div>
      </div>

      <!-- プログレスリング -->
      <div class="meter-wrap">
        <svg class="meter-svg" viewBox="0 0 200 200">
          <circle class="meter-bg-circle" cx="100" cy="100" r="88"/>
          <circle class="meter-bar color-work" id="pomoBar" cx="100" cy="100" r="88"/>
        </svg>
        <div class="meter-center">
          <span class="meter-status" id="pomoStatus">集中時間</span>
          <span class="meter-time" id="pomoDisplay">25:00</span>
          <span class="meter-sub" id="pomoCount">1セット目</span>
        </div>
      </div>

      <!-- 操作ボタン -->
      <div class="action-btns">
        <button class="btn-ctrl btn-primary" id="pomoStartBtn">Start</button>
        <button class="btn-ctrl" id="pomoResetBtn">Reset</button>
      </div>

    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/pomodoro.js"></script>
  <script src="js/navigation.js"></script>
</body>
</html>
